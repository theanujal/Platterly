name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: platterly_app
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: platterly_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://platterly_app:ci_only_password@localhost:5432/platterly_dev?schema=public
      BETTER_AUTH_SECRET: ci-only-secret-not-for-real-use
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check:migrations

      - run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

  # The marketing site (apps/site) is its own app with its own install; it never touches the catering job above.
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - run: npm run check:links

  # Ops (apps/ops) has its own install and its own database; it shares only packages/contract with the other apps.
  ops:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: platterly_app
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: platterly_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/ops

    env:
      DATABASE_URL: postgresql://platterly_app:ci_only_password@localhost:5432/platterly_ops?schema=public
      BETTER_AUTH_SECRET: ci-only-secret-not-for-real-use
      BETTER_AUTH_URL: http://ops.localhost:3200

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ops/package-lock.json

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build
