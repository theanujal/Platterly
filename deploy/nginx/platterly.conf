# Platterly on one VPS behind Cloudflare. Install: cp to /etc/nginx/conf.d/platterly.conf, then
#   mkdir -p /etc/nginx/platterly && deploy.sh writes active-catering.conf and active-ops.conf there (the upstream of the live slot).
# Create both files once before the first nginx start (README step 5) so the includes below resolve.
# Replace the certificate paths with your Cloudflare Origin certificate (or certbot's).

include /etc/nginx/platterly/active-catering.conf;   # defines upstream platterly_catering
include /etc/nginx/platterly/active-ops.conf;        # defines upstream platterly_ops

# Cloudflare sends the visitor's address in CF-Connecting-IP; trust it only from Cloudflare's ranges (add the current list from
# https://www.cloudflare.com/ips/ as set_real_ip_from lines in /etc/nginx/platterly/cloudflare-ips.conf).
include /etc/nginx/platterly/cloudflare-ips.conf;
real_ip_header CF-Connecting-IP;

limit_req_zone $binary_remote_addr zone=platterly_auth:10m rate=10r/s;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name platterly.in www.platterly.in catering.platterly.in ops.platterly.in;
    return 301 https://$host$request_uri;
}

# --- Catering app -------------------------------------------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name catering.platterly.in;
    ssl_certificate     /etc/ssl/platterly/origin.pem;
    ssl_certificate_key /etc/ssl/platterly/origin.key;
    client_max_body_size 12m;

    # Files kitchens upload live outside the releases, shared by both slots (UPLOAD_ROOT in deploy.conf).
    location /uploads/ {
        alias /srv/platterly/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }
    # Expense receipts are private (#99): never served from the folder. The app's /expenses/files/<id> checks the login.
    # A regex location wins over the /uploads/ prefix above.
    location ~ ^/uploads/organizations/[^/]+/expenses/ {
        return 404;
    }

    location / {
        proxy_pass http://platterly_catering;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # Cron and health are for the server itself and for monitors.
    location /api/cron/ { allow 127.0.0.1; deny all; proxy_pass http://platterly_catering; proxy_set_header Host $host; }
}

# --- Platterly Ops ------------------------------------------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name ops.platterly.in;
    ssl_certificate     /etc/ssl/platterly/origin.pem;
    ssl_certificate_key /etc/ssl/platterly/origin.key;
    client_max_body_size 12m;

    # Public lead form from the marketing site: stricter rate limit on top of the app's own.
    location /api/public/ {
        limit_req zone=platterly_auth burst=20 nodelay;
        proxy_pass http://platterly_ops;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/cron { allow 127.0.0.1; deny all; proxy_pass http://platterly_ops; proxy_set_header Host $host; }
    location / {
        proxy_pass http://platterly_ops;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# --- Marketing site (static export from Ops's publish step, docs/site-publish.md) ---------------------------------------------------
# One address for search engines: www goes to the bare domain the canonical tags use.
server {
    listen 443 ssl http2;
    server_name www.platterly.in;
    ssl_certificate     /etc/ssl/platterly/origin.pem;
    ssl_certificate_key /etc/ssl/platterly/origin.key;
    return 301 https://platterly.in$request_uri;
}

server {
    listen 443 ssl http2;
    server_name platterly.in;
    ssl_certificate     /etc/ssl/platterly/origin.pem;
    ssl_certificate_key /etc/ssl/platterly/origin.key;
    root /srv/platterly/site/current;
    index index.html;
    error_page 404 /404.html;
    location / { try_files $uri $uri/ $uri.html =404; }
    location /_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; }
    # Media names are not hashed, so a week rather than a year.
    location /media/ { expires 7d; add_header Cache-Control "public"; }
}
